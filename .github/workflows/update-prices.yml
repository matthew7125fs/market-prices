name: Update market prices

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Save raw USDA report samples instead of updating prices"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from USDA
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/update_prices.py ${{ inputs.probe && '--probe' || '' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in docs samples; do
            if [ -d "$dir" ]; then git add -A "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update market prices"
            git push
          fi
